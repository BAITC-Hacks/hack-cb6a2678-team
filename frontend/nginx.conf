server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        # Ответ агента от локальной LLM может идти минутами
        proxy_read_timeout 300s;
    }

    # SPA: все остальные пути — index.html
    location / {
        try_files $uri /index.html;
    }
}
