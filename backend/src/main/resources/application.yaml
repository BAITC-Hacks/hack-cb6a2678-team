spring:
  application:
    name: backend
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen3:8b}
        temperature: 0.2
        # Режим "размышлений" qwen3 сильно замедляет ответы на CPU, агенту он не нужен
        think: false
        # По умолчанию Ollama даёт ~2k токенов контекста и молча обрезает промпт — ответы инструментов не влезают
        num-ctx: 16384
      init:
        # Модель скачивает сервис ollama-pull из docker-compose; бэкенд стартует без ожидания
        pull-model-strategy: ${OLLAMA_PULL_STRATEGY:never}
    # По умолчанию 10 попыток с растущей паузой — без Ollama запрос висел бы минутами
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
  http:
    clients:
      # Локальная LLM на CPU может отвечать минутами
      read-timeout: 5m

weather:
  model: ${WEATHER_MODEL:ecmwf_ifs}
  publication-delay: ${WEATHER_PUBLICATION_DELAY:7h}
  # Путь относительно backend/ (рабочая папка bootRun); кэш коммитится в репозиторий
  cache-dir: ${WEATHER_CACHE_DIR:../data/weather-cache}
  offline: ${WEATHER_OFFLINE:false}

ml:
  # ML-сервис (ML/, FastAPI): cd ML && uvicorn windml.api:app --port 8000
  base-url: ${ML_BASE_URL:http://localhost:8000}
  local-tz: ${ML_LOCAL_TZ:Asia/Almaty}
  issue-hour-local: 12
  # Метрики: прогнозы отложенного теста (пока ML не отдаёт /v1/evaluation) и SCADA для бейзлайна persistence
  evaluation-dir: ${ML_EVALUATION_DIR:../ML/outputs/training}
  scada-dir: ${ML_SCADA_DIR:../ML/data/raw}

cycle:
  # Результаты циклов агента (коммитятся — жюри видит работу агента без LLM и ML)
  store-dir: ${CYCLE_STORE_DIR:../data/cycles}
  # false — отчёт по шаблону, без Ollama
  llm-report: ${CYCLE_LLM_REPORT:true}

server:
  port: 8080

# Swagger UI показывает контракт из static/openapi.yaml (источник правды для фронта)
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html